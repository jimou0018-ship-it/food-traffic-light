<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a7f37">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>饮食红绿灯 🚦</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #24292f;
    min-height: 100vh;
    padding-bottom: 120px;
  }
  .top {
    position: sticky; top: 0; z-index: 20;
    background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.08);
    padding: 12px 14px 10px;
  }
  .topbar { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 19px; flex: 1; display: flex; align-items: center; gap: 8px; }
  h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.18); }
  body.editing h1 .dot { background: #f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,.2); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .btn {
    border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f;
    border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: #1a7f37; border-color: #1a7f37; color: #fff; font-weight: 600; }
  .btn.danger { background: #fff; border-color: #fca5a5; color: #c62828; }
  .iconbtn {
    border: none; background: none; font-size: 20px; cursor: pointer; padding: 6px 8px; line-height: 1;
  }
  #search {
    width: 100%; margin-top: 10px; padding: 10px 14px; font-size: 16px;
    border: 1px solid #d0d7de; border-radius: 12px; background: #f6f8fa; outline: none;
  }
  #search:focus { border-color: #1a7f37; background: #fff; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }
  .grp {
    background: #fff; border-radius: 16px; padding: 14px;
    margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    border-top: 4px solid;
  }
  .grp.g-green  { border-top-color: #22c55e; }
  .grp.g-yellow { border-top-color: #f59e0b; }
  .grp.g-red    { border-top-color: #ef4444; }
  .grp h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .grp h2 .cnt { color: #8b949e; font-size: 13px; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; font-size: 15px; line-height: 1.3;
    user-select: none; cursor: pointer;
  }
  .chip.c-green  { background: #e8f7ee; color: #166534; }
  .chip.c-yellow { background: #fdf3d8; color: #92600a; }
  .chip.c-red    { background: #fdecec; color: #b91c1c; }
  .chip.hidden { display: none; }
  body.editing .chip { border: 1.5px dashed currentColor; }
  .empty { color: #8b949e; font-size: 14px; padding: 4px 2px; }
  .noresult { display: none; text-align: center; color: #8b949e; padding: 30px 0; font-size: 14px; }
  .addRow { display: none; margin-top: 12px; gap: 8px; }
  body.editing .addRow { display: flex; }
  .addRow input {
    flex: 1; padding: 9px 12px; font-size: 15px; border: 1px solid #d0d7de;
    border-radius: 10px; outline: none; min-width: 0;
  }
  .addRow button { white-space: nowrap; }
  .actionbar {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; box-shadow: 0 -2px 10px rgba(0,0,0,.1);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  body.editing .actionbar { display: flex; gap: 10px; max-width: 560px; margin: 0 auto; }
  .actionbar .btn { flex: 1; padding: 13px 0; font-size: 15px; }
  .sheet-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40;
    align-items: flex-end;
  }
  .sheet-mask.show { display: flex; }
  .sheet {
    background: #fff; border-radius: 18px 18px 0 0; width: 100%;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  .sheet h3 { font-size: 16px; margin-bottom: 14px; text-align: center; }
  .sheet .movebtn {
    display: block; width: 100%; padding: 13px; margin-bottom: 10px;
    border-radius: 12px; border: 1px solid #d0d7de; background: #f6f8fa;
    font-size: 15px; cursor: pointer; text-align: left;
  }
  .sheet .movebtn:disabled { opacity: .4; }
  .sheet .movebtn.m-green  { background: #e8f7ee; border-color: #bbf7d0; color: #166534; }
  .sheet .movebtn.m-yellow { background: #fdf3d8; border-color: #fde68a; color: #92600a; }
  .sheet .movebtn.m-red    { background: #fdecec; border-color: #fecaca; color: #b91c1c; }
  .sheet .cancel { width: 100%; padding: 12px; margin-top: 4px; }
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal h3 { font-size: 17px; margin-bottom: 12px; }
  .modal p { font-size: 13.5px; color: #57606a; margin-bottom: 10px; line-height: 1.6; }
  .modal ol { font-size: 13.5px; color: #57606a; padding-left: 20px; margin-bottom: 12px; line-height: 1.7; }
  .modal a { color: #1a7f37; }
  .modal textarea {
    width: 100%; height: 84px; padding: 10px; font-size: 13px; font-family: monospace;
    border: 1px solid #d0d7de; border-radius: 10px; margin-bottom: 12px; outline: none;
  }
  .modal .row { display: flex; gap: 10px; }
  .modal .row .btn { flex: 1; padding: 11px 0; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,.92); color: #fff; font-size: 14px;
    padding: 10px 20px; border-radius: 999px; z-index: 99;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="top">
  <div class="topbar">
    <h1><span class="dot"></span>饮食红绿灯</h1>
    <button class="iconbtn" id="settingsBtn" title="设置">⚙️</button>
    <button class="btn" id="editBtn">✏️ 编辑</button>
  </div>
  <input id="search" type="search" placeholder="搜索食材，如：番茄 / 虾 / 汤底…">
</div>

<main>
  <div class="noresult" id="noresult">没有找到这个食材～</div>
  <section class="grp g-green">
    <h2>🟢 放心吃 <span class="cnt" id="cnt-green"></span></h2>
    <div class="chips" id="chips-green"></div>
    <div class="addRow"><input id="add-green" placeholder="添加能吃的食材"><button class="btn primary" data-add="green">添加</button></div>
  </section>
  <section class="grp g-yellow">
    <h2>🟡 能吃，但觉得不好吃 <span class="cnt" id="cnt-yellow"></span></h2>
    <div class="chips" id="chips-yellow"></div>
    <div class="addRow"><input id="add-yellow" placeholder="添加不爱吃的食材"><button class="btn primary" data-add="yellow">添加</button></div>
  </section>
  <section class="grp g-red">
    <h2>🔴 不能吃 <span class="cnt" id="cnt-red"></span></h2>
    <div class="chips" id="chips-red"></div>
    <div class="addRow"><input id="add-red" placeholder="添加不能吃的食材"><button class="btn primary" data-add="red">添加</button></div>
  </section>
</main>

<div class="actionbar">
  <button class="btn primary" id="saveBtn">💾 保存到云端</button>
  <button class="btn danger" id="revertBtn">↩️ 放弃修改</button>
</div>

<div class="sheet-mask" id="sheetMask">
  <div class="sheet" id="sheet"></div>
</div>

<div class="modal-mask" id="settingsMask">
  <div class="modal">
    <h3>⚙️ 设置：GitHub Token</h3>
    <p>编辑模式点「保存到云端」需要一个 GitHub 令牌（只需配置一次，保存在本机浏览器）：</p>
    <ol>
      <li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">github.com 创建令牌</a></li>
      <li>Repository access 选 <b>Only select repositories</b> → 只勾选 <b>food-traffic-light</b></li>
      <li>Permissions 里把 <b>Contents</b> 设为 <b>Read and write</b>，其他都不用给</li>
      <li>生成后把令牌粘贴到下面</li>
    </ol>
    <textarea id="tokenInput" placeholder="github_pat_… 或 ghp_…"></textarea>
    <div class="row">
      <button class="btn" id="tokenCancel">取消</button>
      <button class="btn primary" id="tokenSave">保存并验证</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
var REPO = "jimou0018-ship-it/food-traffic-light";
var GROUPS = ["green", "yellow", "red"];
var LABEL = { green: "🟢 放心吃", yellow: "🟡 能吃但不好吃", red: "🔴 不能吃" };
var data = { green: [], yellow: [], red: [] };
var editing = false;
var searchKw = "";

function $(id) { return document.getElementById(id); }
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(msg, ms) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("show"); }, ms || 2200);
}
function saveDraft() {
  try { localStorage.setItem("ftl_draft", JSON.stringify(data)); } catch (e) {}
}

function render() {
  var visible = 0;
  GROUPS.forEach(function (g) {
    var wrap = $("chips-" + g);
    wrap.innerHTML = "";
    data[g].forEach(function (name, i) {
      var el = document.createElement("span");
      el.className = "chip c-" + g;
      el.textContent = name;
      var hit = !searchKw || name.toLowerCase().indexOf(searchKw) > -1;
      if (!hit) el.classList.add("hidden"); else visible++;
      el.onclick = function () { if (editing) openSheet(g, i); };
      wrap.appendChild(el);
    });
    if (data[g].length === 0) {
      var e = document.createElement("span");
      e.className = "empty";
      e.textContent = editing ? "（空）" : "暂无";
      wrap.appendChild(e);
    }
    $("cnt-" + g).textContent = "(" + data[g].length + ")";
  });
  $("noresult").style.display = (visible === 0 && searchKw) ? "block" : "none";
  document.body.classList.toggle("editing", editing);
  $("editBtn").textContent = editing ? "✅ 完成" : "✏️ 编辑";
  if (editing) saveDraft();
}

function openSheet(g, i) {
  var name = data[g][i];
  var html = '<h3>' + esc(name) + '</h3>';
  GROUPS.forEach(function (t) {
    html += '<button class="movebtn m-' + t + '"' + (t === g ? " disabled" : "") +
      ' data-to="' + t + '">' + (t === g ? "当前分组：" : "移动到：") + LABEL[t] + "</button>";
  });
  html += '<button class="movebtn" style="background:#fdecec;border-color:#fecaca;color:#b91c1c" data-del="1">❌ 从清单删除</button>';
  html += '<button class="btn cancel" id="sheetCancel">取消</button>';
  $("sheet").innerHTML = html;
  $("sheetMask").classList.add("show");
  $("sheet").querySelectorAll("[data-to]").forEach(function (b) {
    b.onclick = function () {
      var to = b.getAttribute("data-to");
      data[to].push(data[g].splice(i, 1)[0]);
      $("sheetMask").classList.remove("show");
      render();
    };
  });
  $("sheet").querySelector("[data-del]").onclick = function () {
    data[g].splice(i, 1);
    $("sheetMask").classList.remove("show");
    render();
  };
  $("sheetCancel").onclick = function () { $("sheetMask").classList.remove("show"); };
}
$("sheetMask").onclick = function (e) {
  if (e.target === this) this.classList.remove("show");
};

document.querySelectorAll("[data-add]").forEach(function (btn) {
  var g = btn.getAttribute("data-add");
  function doAdd() {
    var inp = $("add-" + g);
    var v = inp.value.trim();
    if (!v) return;
    var dup = GROUPS.some(function (t) { return data[t].indexOf(v) > -1; });
    if (dup) { toast("「" + v + "」已经在清单里了"); return; }
    data[g].push(v);
    inp.value = "";
    render();
  }
  btn.onclick = doAdd;
  $("add-" + g).addEventListener("keydown", function (e) { if (e.key === "Enter") doAdd(); });
});

$("search").addEventListener("input", function () {
  searchKw = this.value.trim().toLowerCase();
  render();
});

$("editBtn").onclick = function () {
  if (editing) {
    if (localStorage.getItem("ftl_draft")) {
      toast("还有未保存的修改，请点「保存到云端」或「放弃修改」", 3000);
      return;
    }
    editing = false;
  } else {
    editing = true;
    toast("编辑模式：点击食材可移动/删除，每组下方可添加");
  }
  render();
};
$("revertBtn").onclick = function () {
  localStorage.removeItem("ftl_draft");
  editing = false;
  loadRemote(function () { toast("已放弃修改，恢复云端版本"); });
};

function utf8b64(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function ghHeaders(token) {
  return {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json"
  };
}

$("saveBtn").onclick = function () {
  var token = localStorage.getItem("ftl_token");
  if (!token) { openSettings(); return; }
  var btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "保存中…";
  var api = "https://api.github.com/repos/" + REPO + "/contents/data.json";
  fetch(api, { headers: ghHeaders(token) })
    .then(function (r) { if (!r.ok) throw new Error("读取失败(" + r.status + ")，请检查Token权限"); return r.json(); })
    .then(function (info) {
      return fetch(api, {
        method: "PUT",
        headers: ghHeaders(token),
        body: JSON.stringify({
          message: "更新饮食清单 " + new Date().toLocaleString("zh-CN"),
          content: utf8b64(JSON.stringify(data, null, 2)),
          sha: info.sha
        })
      });
    })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error(e.message || ("HTTP " + r.status)); });
      localStorage.removeItem("ftl_draft");
      editing = false;
      render();
      toast("已保存到云端 ✅");
    })
    .catch(function (err) { toast("保存失败：" + err.message, 3500); })
    .finally(function () { btn.disabled = false; btn.textContent = "💾 保存到云端"; });
};

function openSettings() {
  $("tokenInput").value = localStorage.getItem("ftl_token") || "";
  $("settingsMask").classList.add("show");
}
$("settingsBtn").onclick = openSettings;
$("tokenCancel").onclick = function () { $("settingsMask").classList.remove("show"); };
$("tokenSave").onclick = function () {
  var token = $("tokenInput").value.trim();
  if (!token) { toast("请先粘贴令牌"); return; }
  var btn = $("tokenSave");
  btn.disabled = true; btn.textContent = "验证中…";
  fetch("https://api.github.com/repos/" + REPO + "/contents/data.json", { headers: ghHeaders(token) })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 ? "令牌无效" : r.status === 403 ? "令牌无此仓库权限" : "HTTP " + r.status);
      localStorage.setItem("ftl_token", token);
      $("settingsMask").classList.remove("show");
      toast("Token 验证通过 ✅");
    })
    .catch(function (e) { toast("验证失败：" + e.message, 3000); })
    .finally(function () { btn.disabled = false; btn.textContent = "保存并验证"; });
};

function loadRemote(cb) {
  fetch("data.json?t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      data = { green: d.green || [], yellow: d.yellow || [], red: d.red || [] };
      render();
      if (cb) cb();
    })
    .catch(function () { toast("加载失败，请检查网络后刷新"); });
}

loadRemote(function () {
  var draft = localStorage.getItem("ftl_draft");
  if (draft) {
    try {
      var d = JSON.parse(draft);
      if (JSON.stringify(d) !== JSON.stringify(data)) {
        data = d;
        editing = true;
        render();
        toast("已恢复上次未保存的修改，记得保存到云端", 3500);
        return;
      }
      localStorage.removeItem("ftl_draft");
    } catch (e) { localStorage.removeItem("ftl_draft"); }
  }
});
</script>
</body>
</html>
